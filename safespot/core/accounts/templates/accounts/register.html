<!DOCTYPE html>
<html>
<head>
    <title>Register - SafeSpot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="col-md-5 mx-auto">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-3">Create Account</h3>

            {% if messages %}
            <div>
                {% for m in messages %}
                <div class="alert alert-danger">{{ m }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input class="form-control mb-3" type="text" name="username" placeholder="Username">
                <input class="form-control mb-3" type="email" name="email" placeholder="Email">
                <input class="form-control mb-3" type="text" name="phone" placeholder="Phone number">

                <input class="form-control mb-3" type="password" name="password" placeholder="Password">
                <input class="form-control mb-3" type="password" name="confirm" placeholder="Confirm password">

                <button class="btn btn-success w-100">Register</button>
            </form>

            <p class="mt-3 text-center">
                Already have an account? <a href="{% url 'login' %}">Login</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
