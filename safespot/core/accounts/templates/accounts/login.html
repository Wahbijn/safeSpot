<!DOCTYPE html>
<html>
<head>
    <title>Login - SafeSpot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4A90E2 0%, #1B3A57 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4A90E2 0%, #1B3A57 100%);
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
        }

        h3 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1B3A57;
            text-align: center;
            margin-bottom: 2rem;
        }

        .alert-danger {
            background: #fee;
            border: none;
            border-radius: 10px;
            color: #c33;
            padding: 0.875rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            height: 50px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            padding: 0 1rem;
            font-size: 0.95rem;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .form-control:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
            outline: none;
        }

        .btn-primary {
            height: 50px;
            background: linear-gradient(135deg, #4A90E2 0%, #1B3A57 100%);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #4A90E2;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            color: #1B3A57;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
        </div>
    </div>

    <h3>Login</h3>

    {% if messages %}
    <div>
        {% for m in messages %}
        <div class="alert alert-danger">{{ m }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input class="form-control" type="text" name="username" placeholder="Username">
        <input class="form-control" type="password" name="password" placeholder="Password">
        <button class="btn btn-primary">Login</button>
    </form>

    <p class="register-link">
        No account? <a href="{% url 'register' %}">Register</a>
    </p>
</div>

</body>
</html>
